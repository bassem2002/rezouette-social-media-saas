<div
  class="pointer-events-none fixed right-4 top-4 z-[60] flex w-full max-w-xs flex-col gap-2"
  aria-live="polite"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="animate-fade-in pointer-events-auto flex items-start gap-2.5 rounded-xl border border-border bg-white px-3.5 py-2.5 text-sm text-foreground shadow-subtle"
      role="status"
    >
      @if (toast.type === 'success') {
        <lucide-icon [img]="CheckIcon" class="mt-0.5 size-4 shrink-0 text-success" />
      } @else if (toast.type === 'error') {
        <lucide-icon [img]="XIcon" class="mt-0.5 size-4 shrink-0 text-error" />
      }
      <span class="flex-1">{{ toast.message }}</span>
    </div>
  }
</div>
