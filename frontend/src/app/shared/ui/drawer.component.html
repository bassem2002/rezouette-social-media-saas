@if (open()) {
  <div class="fixed inset-0 z-50">
    <div
      class="absolute inset-0 bg-foreground/30 backdrop-blur-[1px]"
      (click)="close.emit()"
      aria-hidden="true"
    ></div>
    <div
      #panel
      role="dialog"
      aria-modal="true"
      [attr.id]="panelId()"
      [attr.aria-label]="title()"
      tabindex="-1"
      [class]="panelClasses()"
    >
      <div class="flex items-start justify-between gap-4 border-b border-border p-4">
        <div class="min-w-0">
          <h2 class="text-base font-semibold text-foreground">{{ title() }}</h2>
          @if (description()) {
            <p class="mt-0.5 text-sm text-muted">{{ description() }}</p>
          }
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <!-- Action facultative de l'en-tête, masquée si rien n'est projeté. -->
          <div class="contents"><ng-content select="[drawerHeaderAction]" /></div>
          <button
            type="button"
            (click)="close.emit()"
            aria-label="Fermer"
            class="rounded-md p-1 text-muted transition-colors duration-150 hover:bg-muted-soft hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          >
            <lucide-icon [img]="XIcon" class="size-4" />
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4"><ng-content /></div>

      <!-- Pied fixe (actions du formulaire) — masqué s'il n'est pas projeté,
           de sorte que les usages existants gardent exactement leur mise en page. -->
      <div class="flex justify-end gap-2 border-t border-border p-4 empty:hidden">
        <ng-content select="[drawerFooter]" />
      </div>
    </div>
  </div>
}
