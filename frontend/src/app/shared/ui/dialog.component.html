@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div
      class="absolute inset-0 bg-foreground/30 backdrop-blur-[1px]"
      (click)="close.emit()"
      aria-hidden="true"
    ></div>
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      tabindex="-1"
      [class]="panelClasses()"
    >
      <div class="flex items-start justify-between gap-4 p-5 pb-0">
        <div class="flex flex-col gap-1">
          <h2 class="text-base font-semibold text-foreground">{{ title() }}</h2>
          @if (description()) {
            <p class="text-sm text-muted">{{ description() }}</p>
          }
        </div>
        <button
          type="button"
          (click)="close.emit()"
          aria-label="Fermer"
          class="rounded-lg p-1 text-muted transition-colors duration-150 hover:bg-muted-soft hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          <lucide-icon [img]="XIcon" class="size-4" />
        </button>
      </div>

      <div class="p-5"><ng-content /></div>

      <div class="flex justify-end gap-2 border-t border-border p-4">
        <ng-content select="[dialogFooter]" />
      </div>
    </div>
  </div>
}
