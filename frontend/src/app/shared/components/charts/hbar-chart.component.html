@if (total() === 0) {
  <app-empty-state
    [title]="emptyLabel()"
    description="Rien à afficher pour le moment."
    className="border-dashed"
  />
} @else {
  <ul class="space-y-3" role="img" [attr.aria-label]="'Répartition — ' + summary()">
    @for (d of data(); track $index) {
      <li>
        <div class="mb-1 flex items-center justify-between gap-3 text-sm">
          <span class="truncate font-medium text-foreground">{{ d.label }}</span>
          <span class="shrink-0 tabular-nums text-muted">{{ d.value }}</span>
        </div>
        <div class="h-2.5 w-full overflow-hidden rounded-full bg-muted-soft">
          <div
            class="h-full rounded-full transition-[width] duration-150"
            [style.width.%]="(d.value / max()) * 100"
            [style.background-color]="d.color ?? color()"
          ></div>
        </div>
      </li>
    }
  </ul>
}
