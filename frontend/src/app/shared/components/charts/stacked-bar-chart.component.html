<div [class]="containerClasses()">
  <div
    [class]="barsClasses()"
    role="img"
    [attr.aria-label]="'Histogramme empilé — ' + summary()"
  >
    @for (bar of bars(); track $index) {
      <div class="flex h-full min-w-0 flex-1 flex-col justify-end gap-px">
        @for (segment of bar.segments; track segment.key) {
          <div
            class="w-full rounded-[2px] transition-[height] duration-150"
            [style.height.%]="segment.heightPct"
            [style.min-height.px]="2"
            [style.background-color]="segment.color"
          ></div>
        }
        <!-- Jour sans aucune publication : un socle visible plutôt qu'un vide,
             pour que la trame du graphique reste lisible. -->
        @if (bar.segments.length === 0) {
          <div class="h-px w-full rounded-[2px] bg-border"></div>
        }
      </div>
    }
  </div>

  <div class="mt-2 flex gap-1">
    @for (bar of bars(); track $index) {
      <div class="min-w-0 flex-1 truncate text-center text-[10px] text-subtle">
        {{ showLabel($index) ? bar.label : '' }}
      </div>
    }
  </div>

  <ul class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1">
    @for (s of series(); track s.key) {
      <li class="flex items-center gap-1.5 text-xs text-muted">
        <span
          aria-hidden="true"
          class="size-2 rounded-full"
          [style.background-color]="s.color"
        ></span>
        {{ s.label }}
      </li>
    }
  </ul>
</div>
