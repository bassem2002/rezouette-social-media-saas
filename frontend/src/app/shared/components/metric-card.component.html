<app-card className="p-5">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="truncate text-sm font-medium text-muted">{{ label() }}</p>
      <p class="mt-2 text-2xl font-semibold tracking-tight text-foreground">
        {{ value() }}
      </p>
      @if (hint()) {
        <p class="mt-1 text-xs text-muted">{{ hint() }}</p>
      }
    </div>
    <span [class]="iconWrapClasses()" aria-hidden="true">
      <ng-content select="[metricIcon]" />
    </span>
  </div>
</app-card>
